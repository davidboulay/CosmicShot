name: Build RPM release asset

# Builds the Fedora/RPM package for a published release and attaches it next
# to the .deb (which is built locally by build-deb.sh and uploaded with the
# release; the APT repo workflow then picks the .deb up).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y rpm python3-pil

      - name: Build RPM
        run: ./build-rpm.sh

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm

      - name: Keep the RPM as a workflow artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: cosmicshot-rpm
          path: dist/*.rpm
